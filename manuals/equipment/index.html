// 初始化
function init(){
  renderCategories();
  renderCategoryOptions();
  renderKpList(0);
}

// 渲染分类
function renderCategories(){
  var html = '';
  MANUAL_DATA.categories.forEach(function(cat, idx){
    var count = cat.points ? cat.points.length : 0;
    html += '<div class="cat-card" onclick="openCategory(' + idx + ')">' +
      '<div class="cat-icon">' + cat.icon + '</div>' +
      '<div class="cat-info">' +
        '<h3>' + cat.name + '</h3>' +
        '<p>' + cat.desc + '</p>' +
      '</div>' +
      '<span class="cat-count">' + count + '个</span>' +
      '<span class="cat-arrow">›</span>' +
    '</div>';
  });
  document.getElementById('catList').innerHTML = html;
}

// 渲染分类选项
function renderCategoryOptions(){
  var html = '<option value="">请选择分类</option>';
  MANUAL_DATA.categories.forEach(function(cat, idx){
    html += '<option value="' + idx + '">' + cat.name + '</option>';
  });
  document.getElementById('subCat').innerHTML = html;
}

// 当前分类
var currentCat = 0;

// 打开分类
function openCategory(idx){
  currentCat = idx;
  renderKpList(idx);
  showPage('category');
  // 更新tab激活状态
  document.querySelectorAll('.tab-item').forEach(function(t){t.classList.remove('active')});
  document.querySelector('[data-tab="category"]').classList.add('active');
}

// 渲染知识点列表
function renderKpList(catIdx){
  var cat = MANUAL_DATA.categories[catIdx];
  var points = cat.points || [];
  var html = '<div style="margin-bottom:12px"><div style="font-size:16px;font-weight:600;margin-bottom:4px">' + cat.icon + ' ' + cat.name + '</div><div style="font-size:12px;color:var(--text-3)">共 ' + points.length + ' 个知识点</div></div>';
  
  if(points.length === 0){
    html += '<div style="text-align:center;color:var(--text-3);padding:40px 0">暂无知识点<br><span style="font-size:12px">点击右下角 + 投稿第一个知识点</span></div>';
  } else {
    points.forEach(function(p, i){
      html += '<div class="kp-card" onclick="openDetail(' + catIdx + ',' + i + ')">' +
        '<div class="kp-title">' +
          '<span class="kp-num">' + (i+1) + '</span>' +
          '<span>' + p.title + '</span>' +
        '</div>' +
        '<div class="kp-desc">' + (p.summary || p.content.substring(0,50) + '...') + '</div>' +
        '<div class="kp-tags">' +
          (p.tags || []).map(function(t){return '<span class="kp-tag">' + t + '</span>'}).join('') +
        '</div>' +
      '</div>';
    });
  }
  document.getElementById('kpList').innerHTML = html;
}

// 打开详情
function openDetail(catIdx, kpIdx){
  var cat = MANUAL_DATA.categories[catIdx];
  var kp = cat.points[kpIdx];
  
  document.getElementById('detailTitle').textContent = kp.title;
  document.getElementById('detailMeta').textContent = cat.name + ' · 第' + (kpIdx+1) + '个知识点';
  
  var body = '';
  if(kp.sections){
    kp.sections.forEach(function(sec){
      body += '<div class="detail-section">';
      body += '<h3>' + sec.title + '</h3>';
      if(sec.type === 'tip'){
        body += '<div class="tip-box">' + sec.content + '</div>';
      } else if(sec.type === 'danger'){
        body += '<div class="danger-box">' + sec.content + '</div>';
      } else if(sec.type === 'success'){
        body += '<div class="success-box">' + sec.content + '</div>';
      } else if(sec.type === 'list'){
        body += '<ul>' + sec.items.map(function(i){return '<li>' + i + '</li>'}).join('') + '</ul>';
      } else {
        body += '<p>' + sec.content + '</p>';
      }
      body += '</div>';
    });
  } else {
    body = '<div class="detail-section"><p>' + kp.content + '</p></div>';
  }
  
  document.getElementById('detailBody').innerHTML = body;
  showPage('detail');
}

// 页面切换
function showPage(name){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.getElementById('page-' + name).classList.add('active');
  
  // 更新tab
  var tabMap = {home:'home', category:'category', detail:'category', profile:'profile'};
  if(tabMap[name]){
    document.querySelectorAll('.tab-item').forEach(function(t){t.classList.remove('active')});
    document.querySelector('[data-tab="' + tabMap[name] + '"]').classList.add('active');
  }
  
  // 滚动到顶部
  document.querySelector('.app-content').scrollTop = 0;
}

// 返回首页
function goHome(){
  location.href = '../../index.html';
}

// 搜索
function openSearch(){
  document.getElementById('searchOverlay').classList.add('show');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '<div class="sr-empty">输入关键词搜索</div>';
  setTimeout(function(){document.getElementById('searchInput').focus()}, 100);
}
function closeSearch(){
  document.getElementById('searchOverlay').classList.remove('show');
}
function doSearch(val){
  val = val.trim().toLowerCase();
  var results = document.getElementById('searchResults');
  if(!val){
    results.innerHTML = '<div class="sr-empty">输入关键词搜索</div>';
    return;
  }
  var matches = [];
  MANUAL_DATA.categories.forEach(function(cat, ci){
    (cat.points||[]).forEach(function(p, pi){
      if(p.title.toLowerCase().indexOf(val)>-1 || (p.content||'').toLowerCase().indexOf(val)>-1){
        matches.push({catIdx:ci, kpIdx:pi, title:p.title, cat:cat.name});
      }
    });
  });
  if(matches.length===0){
    results.innerHTML = '<div class="sr-empty">未找到相关知识点</div>';
    return;
  }
  var html = '';
  matches.forEach(function(m){
    html += '<div class="search-result-item" onclick="closeSearch();openDetail('+m.catIdx+','+m.kpIdx+')">' +
      '<div class="sr-title">' + m.title + '</div>' +
      '<div class="sr-cat">' + m.cat + '</div>' +
    '</div>';
  });
  results.innerHTML = html;
}

// 投稿
function openSubmit(){
  document.getElementById('subName').value = '';
  document.getElementById('subCat').value = currentCat;
  document.getElementById('subTitle').value = '';
  document.getElementById('subContent').value = '';
  openModal('submitModal');
}
function submitKp(){
  var name = document.getElementById('subName').value.trim();
  var cat = document.getElementById('subCat').value;
  var title = document.getElementById('subTitle').value.trim();
  var content = document.getElementById('subContent').value.trim();
  if(!name){showToast('请填写投稿人');return}
  if(cat===''){showToast('请选择分类');return}
  if(!title){showToast('请填写标题');return}
  if(!content){showToast('请填写内容');return}
  
  var key = 'pending_' + MANUAL_DATA.id;
  var pending = JSON.parse(localStorage.getItem(key) || '[]');
  pending.unshift({
    id: Date.now(),
    name: name,
    catIdx: parseInt(cat),
    catName: MANUAL_DATA.categories[parseInt(cat)].name,
    title: title,
    content: content,
    time: new Date().toLocaleString('zh-CN'),
    status: '待审核'
  });
  localStorage.setItem(key, JSON.stringify(pending));
  
  closeModal('submitModal');
  showToast('✅ 投稿成功，等待审核');
}

// 我的投稿
function showPending(){
  var key = 'pending_' + MANUAL_DATA.id;
  var pending = JSON.parse(localStorage.getItem(key) || '[]');
  var html = '';
  if(pending.length===0){
    html = '<p style="text-align:center;color:var(--text-3);padding:30px 0">还没有投稿记录<br><span style="font-size:12px">点击右下角 + 提交你的第一条知识建议</span></p>';
  } else {
    pending.forEach(function(item){
      html += '<div style="padding:12px 0;border-bottom:1px solid var(--border)">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
          '<span style="font-size:14px;font-weight:500">' + item.title + '</span>' +
          '<span style="font-size:11px;padding:2px 8px;background:var(--warning-light);color:var(--warning);border-radius:10px">' + item.status + '</span>' +
        '</div>' +
        '<div style="font-size:12px;color:var(--text-3);margin-bottom:6px">' + item.catName + ' · ' + item.name + '</div>' +
        '<div style="font-size:13px;color:var(--text-2)">' + item.content.substring(0,60) + (item.content.length>60?'...':'') + '</div>' +
        '<div style="font-size:11px;color:var(--text-3);margin-top:6px">' + item.time + '</div>' +
      '</div>';
    });
  }
  document.getElementById('pendingBody').innerHTML = html;
  openModal('pendingModal');
}

// 统计
function showStats(){
  var total = 0;
  MANUAL_DATA.categories.forEach(function(c){total += (c.points||[]).length});
  var html = '<div style="text-align:center;margin-bottom:20px">' +
    '<div style="font-size:36px;font-weight:700;color:var(--primary)">' + total + '</div>' +
    '<div style="font-size:13px;color:var(--text-3);margin-top:4px">总知识点</div>' +
  '</div>';
  html += '<div style="font-size:14px;font-weight:600;margin-bottom:10px">各分类分布</div>';
  MANUAL_DATA.categories.forEach(function(c){
    var count = (c.points||[]).length;
    var pct = total>0 ? Math.round(count/total*100) : 0;
    html += '<div style="margin-bottom:12px">' +
      '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">' +
        '<span>' + c.icon + ' ' + c.name + '</span>' +
        '<span style="color:var(--text-3)">' + count + '个 (' + pct + '%)</span>' +
      '</div>' +
      '<div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden">' +
        '<div style="height:100%;width:' + pct + '%;background:var(--primary);border-radius:3px"></div>' +
      '</div>' +
    '</div>';
  });
  document.getElementById('statsBody').innerHTML = html;
  openModal('statsModal');
}

// 更新日志
function showChangelog(){
  var logs = MANUAL_DATA.changelog || [];
  var html = '';
  if(logs.length===0){
    html = '<p style="text-align:center;color:var(--text-3);padding:30px 0">暂无更新记录</p>';
  } else {
    logs.forEach(function(log){
      html += '<div style="padding:12px 0;border-bottom:1px solid var(--border)">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
          '<span style="font-size:14px;font-weight:600">' + log.version + '</span>' +
          '<span style="font-size:12px;color:var(--text-3)">' + log.date + '</span>' +
        '</div>' +
        '<div style="font-size:13px;color:var(--text-2);line-height:1.6">' + log.content + '</div>' +
      '</div>';
    });
  }
  document.getElementById('changelogBody').innerHTML = html;
  openModal('changelogModal');
}

// 弹窗
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('.modal-mask').forEach(function(m){
  m.addEventListener('click',function(e){if(e.target===m) m.classList.remove('show')});
});

// Toast
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2000);
}

// 启动
init();
</script>
